name: CI/CD

on:
  push:
    branches: ["dev"]

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-20.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests with H2 (test profile)
        run: ./gradlew clean test -Dspring.profiles.active=test --no-daemon

      - name: Build Spring Boot JAR
        run: ./gradlew bootJar --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: surpmh
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/surpmh/profile-api:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-20.04
    steps:
      - name: SSH & Pull Image
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_SSH_HOST }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            docker pull ghcr.io/surpmh/profile-api:latest
            docker rm -f profile-api || true
            docker run -d \
              --name profile-api \
              -p 8080:8080 \
              --restart unless-stopped \
              -e SPRING_PROFILES_ACTIVE=dev \
              ghcr.io/surpmh/profile-api:latest
