spring:
  application:
    name: profile-api
  config:
    import: optional:file:.env[.properties]
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate.timezone.default_storage: NORMALIZE  # 한 줄로도 표현 가능
---
spring:
  config.activate.on-profile: local
  datasource:
    url: jdbc:mariadb://localhost:3306/test
    username: root
    password: 123456
---
spring:
  config.activate.on-profile: dev
  datasource:
    url: jdbc:mariadb://${DEV_DB_URL}:${DEV_DB_PORT}/${DEV_DB_NAME}
    username: ${DEV_DB_USERNAME}
    password: ${DEV_DB_PASSWORD}